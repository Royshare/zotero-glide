name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Fast Reader is a reader tab, not a PDF editor. See "What it is not" in the README before filing.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
